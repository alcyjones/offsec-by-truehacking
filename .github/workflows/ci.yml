name: CI (TypeScript/Turborepo/Vitest)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx turbo run typecheck

      - name: Lint (oxlint)
        run: npx turbo run lint:built

      - name: Format (oxfmt)
        run: npx turbo run format:check

      - name: Tests (vitest)
        run: npx turbo run test:run

      - name: Generate docs/catalog
        run: npx turbo run docs:generate

      - name: Check (pre-commit gate)
        run: npx turbo run check:fast
